<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Winding">
  <title>Winding</title>
  <!--
    Four sails, each a triangle, sweeping counter-clockwise: the winding order
    the renderer treats as front-facing. The hue steps around the turn, so the
    mark reads as rotating even when it is still. Each sail is creased from
    its tip, one half a shade darker, like folded paper, and the hub is a pin
    with a rim and a glint of light.

    Mid-tone blues on purpose. It sits on white and on dark without a second
    file or a prefers-color-scheme switch.
  -->
  <g transform="rotate(45 32 32)">
    <path d="M32 30 L32 4 L42.5 21 Z" fill="#1F5FD8"/>
    <path d="M32 4 L42.5 21 L37.25 25.5 Z" fill="#16449C"/>
    <path d="M34 32 L60 32 L43 42.5 Z" fill="#2E86EC"/>
    <path d="M60 32 L43 42.5 L38.5 37.25 Z" fill="#2160AA"/>
    <path d="M32 34 L32 60 L21.5 43 Z" fill="#41A8F5"/>
    <path d="M32 60 L21.5 43 L26.75 38.5 Z" fill="#2F79B0"/>
    <path d="M30 32 L4 32 L21 21.5 Z" fill="#59C8FB"/>
    <path d="M4 32 L21 21.5 L25.5 26.75 Z" fill="#4090B5"/>
  </g>
  <circle cx="32" cy="32" r="3.8" fill="#0B2763"/>
  <circle cx="31.6" cy="31.6" r="3.25" fill="#123C8E"/>
  <path d="M29.7 31.2 A2.3 2.3 0 0 1 31.2 29.5" fill="none" stroke="#9CC9F7" stroke-width="0.8" stroke-linecap="round"/>
</svg>
