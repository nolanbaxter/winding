<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 84" width="336" height="84" role="img" aria-label="Winding">
  <title>Winding</title>
  <!--
    For light backgrounds.
    Paired with wordmark-dark.svg and selected by the
    <picture> element in README.md, which follows GitHub's own theme. A
    prefers-color-scheme rule inside the SVG would follow the OS instead, and
    go invisible for anyone whose GitHub theme and OS disagree.

    The sails are logo.svg at 1.3x. The word is whatever monospace the reader
    has; no font is embedded, so this stays under a kilobyte.
  -->
  <g transform="translate(1 1) scale(1.3)">
    <g transform="rotate(45 32 32)">
      <path d="M32 30 L32 4 L42.5 21 Z" fill="#1F5FD8"/>
      <path d="M32 4 L42.5 21 L37.25 25.5 Z" fill="#16449C"/>
      <path d="M34 32 L60 32 L43 42.5 Z" fill="#2E86EC"/>
      <path d="M60 32 L43 42.5 L38.5 37.25 Z" fill="#2160AA"/>
      <path d="M32 34 L32 60 L21.5 43 Z" fill="#41A8F5"/>
      <path d="M32 60 L21.5 43 L26.75 38.5 Z" fill="#2F79B0"/>
      <path d="M30 32 L4 32 L21 21.5 Z" fill="#59C8FB"/>
      <path d="M4 32 L21 21.5 L25.5 26.75 Z" fill="#4090B5"/>
    </g>
    <circle cx="32" cy="32" r="3.8" fill="#0B2763"/>
    <circle cx="31.6" cy="31.6" r="3.25" fill="#123C8E"/>
    <path d="M29.7 31.2 A2.3 2.3 0 0 1 31.2 29.5" fill="none" stroke="#9CC9F7" stroke-width="0.8" stroke-linecap="round"/>
  </g>
  <text x="98" y="60" fill="#1F2328" font-size="54" font-weight="700" letter-spacing="-1"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Winding</text>
</svg>
