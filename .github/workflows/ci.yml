# The Node suites on every push and pull request, and the GPU suite beside them.
#
# There is no install step for the Node suites because there are no
# dependencies: nothing to cache, nothing to audit, nothing to go stale between
# a green run and a red one.
#
# The GPU suite runs test/gpu.html in headless Chrome. The runner has no GPU,
# so Mesa's lavapipe stands in: a software Vulkan device, slow, but it compiles
# and runs every shader and reads back every frame, which is the point -- nearly
# everything this engine has got wrong was invisible to the Node
# suites. A pass there is not a pass on every real GPU; the page at
# test/gpu.html still is the test of one.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # The types, against the docs' examples. TypeScript is fetched for this
      # step alone; the package still depends on nothing.
      - run: npx -y -p typescript@7 tsc --noEmit --strict --target es2022 --module nodenext --lib es2022,dom test/types.ts

  gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - run: node test/gpu.ci.js
