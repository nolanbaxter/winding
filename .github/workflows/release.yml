# Release, derived from package.json.
#
# The whole release is a normal commit:
#
#   edit package.json + CHANGELOG.md
#   git commit -m "Release 0.7.4: ..." && git push
#
# and this tags it, writes the GitHub release from the changelog, and publishes
# to npm. Nothing to tag by hand, nothing to remember in order.
#
# ONE SOURCE OF TRUTH. This used to be two -- a tag and a version field -- with
# a guard comparing them, which is the shape of a design that has a problem
# rather than a solution. package.json is the one that gets published, the one
# `npm view` reports and the one the /gh/ CDN route serves, so it is the truth
# and the tag is derived from it. Nothing can disagree with itself.
#
# THE GUARD THAT REPLACED IT is the changelog. A version with no `## [x.y.z]`
# section does not release, which makes "bumped" and "written up" one event
# instead of two things to remember separately -- and stops a version bump in
# some unrelated commit from shipping by itself.
#
# NO TOKEN for npm. Trusted publishing: GitHub mints a short-lived OIDC token
# for this exact workflow in this repository and npm verifies it. An automation
# token in a secret would work and be worse -- long-lived, bypasses 2FA by
# design, and anything that can read it can publish forever.
#
# ONE-TIME SETUP on npmjs.com:
#   winding-engine -> Settings -> Trusted publishers -> GitHub Actions,
#   repository nolanbaxter/winding, workflow file release.yml.
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']
  # For re-running a release whose publish failed, without inventing a version.
  workflow_dispatch:

permissions:
  contents: write        # create the tag and the release
  id-token: write        # mint the OIDC token npm checks

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tags, so an already-released version is visible

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; the runner ships older.
      - run: npm install -g npm@latest

      - name: What does package.json claim
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      # TWO QUESTIONS, NOT ONE. "Is it tagged" and "is it published" are
      # different facts with different sources of truth -- git and the registry
      # -- and they come apart the moment a publish fails after a release is
      # created, or a release is cut by hand. Treating the tag as proof of both
      # is what would have left 0.7.3 released on GitHub and unpublishable by
      # this workflow forever.
      #
      # So each step is idempotent against the thing that actually knows.
      - name: Is this version already tagged
        id: tagged
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "tag v${{ steps.version.outputs.version }} exists"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Is this version already on npm
        id: published
        run: |
          name="$(node -p "require('./package.json').name")"
          version="${{ steps.version.outputs.version }}"
          # `npm view` exits non-zero for a version that does not exist, which
          # is the answer rather than a failure.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to do
        if: steps.tagged.outputs.already == 'true' && steps.published.outputs.already == 'true'
        run: echo "v${{ steps.version.outputs.version }} is tagged and published. Done."

      # Before the tag exists, so a missing changelog costs nothing to fix.
      - name: The changelog must describe this version
        if: steps.tagged.outputs.already == 'false'
        run: node .github/release-notes.js "${{ steps.version.outputs.version }}" > /tmp/notes.md

      - name: The Node suites
        if: steps.tagged.outputs.already == 'false' || steps.published.outputs.already == 'false'
        run: npm test

      - name: Tag and release
        if: steps.tagged.outputs.already == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          # An annotated tag records who made it, and a runner has no identity
          # of its own. The bot is the honest answer: a workflow did make it.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "Winding $version"
          git push origin "v$version"
          gh release create "v$version" \
            --title "Winding $version" \
            --notes-file /tmp/notes.md

      # Provenance comes free with trusted publishing: npm records the
      # workflow, commit and repository that produced the tarball.
      - name: Publish
        if: steps.published.outputs.already == 'false'
        run: npm publish
