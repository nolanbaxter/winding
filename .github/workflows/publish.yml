# Publish to npm when a GitHub release is published.
#
# NO TOKEN. This uses npm's trusted publishing, where GitHub mints a
# short-lived OIDC token for this exact workflow in this exact repository and
# npm verifies it. That is what `id-token: write` below is for.
#
# The alternative is an automation token in a repository secret, which works
# and is worse: it is long-lived, it bypasses two-factor auth by design, and
# anything that can read the secret can publish as you forever. A credential
# that cannot leak beats one that is merely stored carefully.
#
# It also means the account's `auth-and-writes` 2FA stays on. That setting is
# why publishing by hand asks for a security key every time, and trusted
# publishing does not weaken it -- the workflow is a separately authorised
# publisher, not an exemption.
#
# ONE-TIME SETUP, on npmjs.com and not here:
#   Package settings -> Trusted publishers -> add GitHub Actions, with
#   repository nolanbaxter/winding and workflow file publish.yml.
# Until that exists this job fails at the publish step, having harmed nothing.
name: Publish

on:
  release:
    types: [published]
  # So a release that was created before trusted publishing was configured can
  # still be published, without inventing a version to hang it on.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # mints the OIDC token npm checks

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; the runner ships older.
      - run: npm install -g npm@latest

      # The tag is the claim; package.json is what actually gets published.
      # They disagree exactly once -- when someone tags without bumping -- and
      # the result is a release whose notes describe a version nobody can
      # install. Cheaper to fail here than to unpublish later.
      - name: The tag and package.json must agree
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          test "$tag" = "$pkg"

      - run: npm test

      # Provenance comes free with trusted publishing: npm records which
      # workflow, commit and repository produced the tarball, and shows it on
      # the package page.
      - run: npm publish
